<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RM amélioré — simulation</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#0AC786;--gd:#07905f;--mint:#E8FBF4;--txt:#404040;--red:#D64E5A;--org:#F2A62C;--blu:#1239D9;--gry:#B5B5B5}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,"Segoe UI",Arial,sans-serif;color:var(--txt);background:#fff;font-size:12px}
a{color:var(--g);cursor:pointer;text-decoration:none}
.app{display:flex;min-height:100vh}
.side{width:210px;flex-shrink:0;background:#F8F9FB;display:flex;flex-direction:column;padding:18px 16px;gap:4px}
.logo{font-size:28px;font-weight:800;color:#1E2A26;letter-spacing:-1px;line-height:1}
.nav{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:12px;font-size:12px;color:var(--txt)}
.nav.on{background:var(--g);color:#fff}
.sec{font-size:11px;font-weight:600;color:#1E2A26;margin:10px 0 4px}
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 30px}
.user{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.band{background:var(--mint);padding:16px 36px;display:flex;justify-content:space-between;align-items:center}
.title{font-size:24px;font-weight:800;color:var(--g)}
.content{padding:18px 36px;display:flex;flex-direction:column;gap:12px}
.btn{background:var(--g);color:#fff;border-radius:12px;padding:9px 16px;font-weight:600;display:inline-block}
.btn2{border:1px solid var(--org);color:#E08A00;border-radius:10px;padding:8px 16px;font-weight:600}
.badge{color:#fff;border-radius:700px;padding:2px 8px;font-size:10px;font-weight:600;white-space:nowrap;display:inline-block}
.pill{border-radius:700px;font-size:10px;font-weight:600;padding:1px 8px;background:var(--red);color:#fff}
table{border-collapse:collapse;width:100%}
th{font-size:10px;font-weight:600;color:#000;text-align:left;padding:10px 8px;text-transform:uppercase;background:var(--mint)}
td{font-size:12px;color:#000;padding:10px 8px;border-top:1px solid #EFEFEF;position:relative}
.menu{position:absolute;right:30px;top:8px;width:340px;background:#fff;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:6px;display:flex;flex-direction:column;z-index:5}
.menu span,.menu a{padding:8px 10px;border-radius:8px}
.new{border:2px dashed #F59E0B;border-radius:12px;padding:10px 12px}
.newitem{border:2px dashed #F59E0B;background:#FFF8EA;color:#0B7A55;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.chip{background:#F59E0B;color:#1F1300;border-radius:700px;padding:1px 8px;font-size:10px;font-weight:700;margin-left:8px}
body.plain .new{border:none;padding:0}body.plain .newitem{border:none;background:none}body.plain .chip{display:none}
.grid{display:flex;border:1px solid #DADADA}
.hours{width:56px;flex-shrink:0}
.hours div,.col .cell{height:52px;border-bottom:1px solid #EEE;font-size:10px;padding:2px 6px;color:#888}
.colh{height:58px;border-bottom:1px solid #DADADA;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;background:#FAFAFA}
.col{flex:1;min-width:0;border-left:1px solid #DADADA;display:flex;flex-direction:column}
.colbody{height:468px;position:relative}
.bloc{position:absolute;left:6px;right:6px;color:#fff;border-radius:6px;padding:4px 8px;display:flex;flex-direction:column;overflow:hidden}.bloc.am{padding-right:30px}.vx{position:absolute;top:4px;right:5px;width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;background:#fff}.vx.v{color:#12B312}.vx.x{color:#D64E5A}.bloc{cursor:pointer}
.bloc b,.bloc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drop{position:absolute;left:6px;right:6px;bottom:8px;border:2px dashed var(--blu);border-radius:8px;padding:10px 4px;text-align:center;color:var(--blu);font-weight:600;background:#F2F5FF}
.slot{position:absolute;left:6px;right:6px;height:46px;margin-top:3px;border:2px dashed var(--blu);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--blu);font-weight:600;background:#F2F5FF;font-size:11px}.slot:hover{background:#DCE5FF}
input.field,select.field{font:inherit;color:inherit;background:#fff;width:100%}
.mailbox{border:1px solid #DADADA;border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.5;background:#FCFCFC}
.pt{font-size:10px;background:#FFF3DC;color:#8A5300;border-radius:700px;padding:1px 8px}
.drawer{position:absolute;top:56px;right:0;bottom:0;width:640px;background:#fff;box-shadow:-6px 0 20px rgba(0,0,0,.12);padding:16px 18px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.card{border:1px solid #E3E3E3;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.card.sel{border:2px solid var(--blu)}
.tab{position:fixed;right:0;bottom:24px;background:#1E7BFF;color:#fff;border-radius:12px 0 0 12px;padding:14px 16px;font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(20,30,28,.45);display:flex;align-items:center;justify-content:center;z-index:20}
.modal{width:560px;background:#fff;border-radius:14px;padding:22px 26px;display:flex;flex-direction:column;gap:10px}
.lbl{font-size:10px;font-weight:600;color:var(--g);background:var(--mint);border-radius:4px;padding:1px 6px;align-self:flex-start}
.field{border:1px solid #DADADA;border-radius:8px;padding:8px 10px}
.row{display:flex;gap:10px}.f{flex:1;display:flex;flex-direction:column;gap:3px}
.opt{border:1px solid #DADADA;border-radius:8px;padding:6px 10px}.opt.on{background:var(--g);color:#fff;border-color:var(--g);font-weight:600}
.toast{position:fixed;left:240px;bottom:24px;max-width:calc(100vw - 470px);background:var(--g);color:#fff;border-radius:12px;padding:12px 18px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:30}
.legend{display:flex;gap:14px;font-size:10px;color:#555}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
.note{font-size:11px;color:#666}
.plq{color:var(--g);font-weight:600;text-decoration:underline dotted}
.kpi{flex:1;border:1px solid #E3E3E3;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.kpi b{font-size:14px}
.vtabs{display:flex;gap:6px;border-bottom:1px solid #E3E3E3}.vtabs a{padding:8px 14px;color:var(--txt);border-bottom:3px solid transparent}.vtabs a.on{color:var(--g);border-color:var(--g);font-weight:600}
.switch{font-size:11px;color:#555;display:flex;gap:6px;align-items:center}
</style>
</head>
<body>
<div id="app"></div>
<script>
const S = { screen: (location.hash==='#planning'?'planning':'decl'), menu:null, modal:null, cur:null, created:{}, placed:{}, tache:false, picked:null, drawer:true, toast:'', typeInt:'rapide', slot:{}, extra:[], ajType:'veh', form:{}, aplacer:null, veh:null, vtab:'suivi', depl:null, fait:{}, clos:{}, replan:{}, envoye:{}, renvoi:{}, mailIds:[], blocId:null };
const raw = [
 {id:'a', type:'Béquilles', plaque:'XX359HS', date:'05/06/2026 09:35', desc:'béquille très dure et saute de cran', photo:'Oui', rouler:'Oui', ou:'Site Port', dispo:"Dispo aujourd'hui"},
 {id:'b', type:'Entretiens', plaque:'XX137BY', date:'18/05/2026 11:23', desc:'pas ABS, dangereux sous pluie', photo:'Non', rouler:'Non', ou:'Site Port', dispo:"Dispo aujourd'hui"},
 {id:'c', type:'Casses', plaque:'XX211DW', date:'18/05/2026 03:42', desc:'porte coffre à équerres côté passager', photo:'Oui', rouler:'Oui', ou:'En tournée', dispo:'Retour demain'},
 {id:'d', type:'Dysfonctionnement éclairages', plaque:'XX174CX', date:'27/05/2026 14:25', desc:'clignotant gauche HS, ampoule correcte', photo:'Non', rouler:'Oui', ou:'Site Nord', dispo:"Dispo aujourd'hui"},
 {id:'e', type:'Casses', plaque:'XX433JQ', date:'27/05/2026 19:53', desc:'tordue gauche', photo:'Oui', rouler:'[à confirmer]', ou:'Site Port', dispo:"Dispo aujourd'hui"},
 {id:'f', type:'Casses', plaque:'XX248EV', date:'28/05/2026 05:00', desc:'manque garde-boue arrière droit', photo:'Oui', rouler:'Oui', ou:'En tournée', dispo:'Retour [date]'},
 {id:'g', type:'Casses', plaque:'XX470KP', date:'03/06/2026 12:59', desc:'pare-chocs', photo:'Oui', rouler:'Oui', ou:'Site Port', dispo:"Dispo aujourd'hui"},
 {id:'h', type:'Béquilles', plaque:'XX285FU', date:'05/06/2026 12:03', desc:'sabot qui ne tient plus', photo:'Oui', rouler:'Oui', ou:'Site Port', dispo:"Dispo aujourd'hui"}
];
const byId = Object.fromEntries(raw.map(r=>[r.id,r]));
// véhicules — données d'exemple
const VEH = {
 XX359HS:{type:'SR Porte conteneur',marque:'MARQUE A',pole:'Conteneur',rouler:'Oui',ou:'Site Port',mines:'12/01/2027',rdv:'',prepa:'À faire',tachy:'',lim:''},
 XX137BY:{type:'SR Porte conteneur',marque:'MARQUE B',pole:'Conteneur',rouler:'Non',ou:'Site Port',mines:'20/11/2026',rdv:'18/11/2026 · Centre de contrôle',prepa:'En cours',tachy:'',lim:''},
 XX211DW:{type:'SR Plateau',marque:'MARQUE C',pole:'Conventionnel',rouler:'Oui',ou:'En tournée',mines:'03/03/2027',rdv:'',prepa:'—',tachy:'',lim:''},
 XX174CX:{type:'SR Frigorifique',marque:'MARQUE E',pole:'Conventionnel',rouler:'Oui',ou:'Site Nord',mines:'28/02/2027',rdv:'',prepa:'—',tachy:'',lim:''},
 XX433JQ:{type:'SR Porte conteneur',marque:'MARQUE F',pole:'Conteneur',rouler:'[à confirmer]',ou:'Site Port',mines:'09/12/2026',rdv:'',prepa:'À faire',tachy:'',lim:''},
 XX248EV:{type:'SR Porte conteneur',marque:'MARQUE D',pole:'Traction',rouler:'Oui',ou:'En tournée',mines:'15/05/2027',rdv:'',prepa:'—',tachy:'',lim:''},
 XX470KP:{type:'SR Porte conteneur',marque:'MARQUE A',pole:'Conteneur',rouler:'Oui',ou:'Site Port',mines:'30/04/2027',rdv:'',prepa:'—',tachy:'',lim:''},
 XX285FU:{type:'SR Porte conteneur',marque:'MARQUE B',pole:'Conteneur',rouler:'Oui',ou:'Site Port',mines:'22/01/2027',rdv:'',prepa:'—',tachy:'',lim:''},
 XX544MN:{type:'Tracteur routier',marque:'DAF',pole:'Conteneur',rouler:'[à confirmer]',ou:'Site Nord',mines:'25/11/2026',rdv:'',prepa:'À faire',tachy:'25/11/2026',lim:'25/11/2026'},
 XX322GT:{type:'Tracteur routier',marque:'MAN',pole:'Conventionnel',rouler:'Oui',ou:'Site Nord',mines:'14/06/2027',rdv:'',prepa:'—',tachy:'14/06/2027',lim:'14/06/2027'},
 XX618OL:{type:'Tracteur routier',marque:'DAF',pole:'Traction',rouler:'Oui',ou:'Site Nord',mines:'08/09/2027',rdv:'',prepa:'—',tachy:'08/09/2027',lim:'08/09/2027'},
 XX100AZ:{type:'SR Frigorifique',marque:'MARQUE E',pole:'Conventionnel',rouler:'Non',ou:'Garage extérieur',mines:'29/06/2026',rdv:'',prepa:'—',tachy:'',lim:''}
};
const lienPlaque = (p)=> VEH[p] ? `<a class="plq" data-a="veh:${p}">${p}</a>` : p;
const H = 52;
const C = { gry:'#B5B5B5', blu:'#1239D9', grn:'#12B312', red:'#D64E5A', org:'#F2A62C' };
const badge = (bg, txt, col) => `<span class="badge" style="background:${bg};color:${col||'#fff'}">${txt}</span>`;
const cols = {
 m1:{nom:'Mécanicien PL 1', pt:'Arrivé 07:32 · Site Nord', drop:[H*6,'14:00'], base:[[0,2,'#B86A12','XX137BY · Préparation mines','08:00 – 10:00 · Site Port'],[5,1,'#0AC786','XX322GT · Voyants tableau de bord','13:00 – 14:00']]},
 m2:{nom:'Mécanicien PL 2', pt:'Arrivé 07:45 · Site Port', drop:[H*5,'13:00'], base:[[1,2,'#0AC786','XX618OL · Changement pneu','09:00 – 11:00 · Site Nord'],[4,0.5,'#5B6CC9','Aller chercher des pièces','12:00 – 12:30 · sans véhicule']]},
 m3:{nom:'Mécanicien PL 3', pt:'Arrivé 07:58 · Site Nord', drop:[H*2,'10:00'], base:[[0,1.5,'#7A8A86','Administratif','08:00 – 09:30 · hors mécanique'],[7,2,'#7A8A86','Rendez-vous','15:00 – 17:00 · départ plus tôt']]},
 g:{nom:'Garage extérieur', pt:'', drop:[H*1,'09:00'], base:[[0,1,'#7A8A86','XX100AZ · au garage extérieur','retour prévu [date]']]}
};
function intervList(){
 const L=[];
 raw.forEach(r=>{ if(S.created[r.id]) L.push({key:r.id,kind:'veh',dur:1,type:S.created[r.id],plaque:r.plaque,cree:'16/11/2026',duree:'01:00',comm:r.desc,rouler:r.rouler,ou:r.ou,dispo:r.dispo,decl:'↗ déclaration du '+r.date.slice(0,10)+(S.replan[r.id]?' · à replanifier : '+S.replan[r.id]:'')}); });
 S.extra.forEach(x=>L.push(x));
 L.push({key:'x',kind:'veh',dur:1,type:'Intervention immo',plaque:'XX544MN',cree:'08/07/2026',duree:'00:00',comm:'limiteur + mines + pneus avant + pare-brise',rouler:'[à confirmer]',ou:'[à confirmer]',dispo:'[à confirmer]',decl:'saisie à la main (pas de déclaration liée)'});
 return L;
}
const hh = (x)=>{ const m=Math.round((8+x)*60); return String(Math.floor(m/60)).padStart(2,'0')+'h'+String(m%60).padStart(2,'0'); };
const couleur = (it)=> it.kind==='tache'?'#5B6CC9':(it.kind==='hors'?'#7A8A86':(/mines/i.test(it.type)?'#B86A12':'#0AC786'));
function occupe(k, sauf){ const o=[]; cols[k].base.forEach(x=>o.push([x[0],x[0]+x[1]])); Object.entries(S.slot).forEach(([id,s])=>{ if(s.k===k && id!==sauf) o.push([s.i,s.i+s.d]); }); return o; }
function aEnvoyer(){ const m=Object.fromEntries(intervList().map(i=>[i.key,i])); return Object.keys(S.slot).filter(id=>m[id]&&m[id].kind==='veh'&&!S.envoye[id]&&!S.fait[id]); }
function set(p){ Object.assign(S,p); render(); }
function bloc(top,h,bg,t,s){ const court=h<40; return `<div class="bloc" title="${t} · ${s}" style="top:${top}px;height:${h}px;background:${bg}${court?';padding:3px 8px;justify-content:center':''}"><b${court?' style="font-size:11px"':''}>${t}${court?` <span style="font-weight:400;font-size:10px">· ${s.split(' · ')[0]}</span>`:''}</b>${court?'':`<span style="font-size:10px">${s}</span>`}</div>`; }
function render(){
 const all = intervList(); const allMap = Object.fromEntries(all.map(i=>[i.key,i]));
 const nb = 179 - Object.keys(S.clos).length;
 let h = `<div class="app"><div class="side"><div style="margin-bottom:14px"><div class="logo">RM</div><div style="font-size:11px">ressources matérielles</div></div><div style="height:30px;border:1px solid #DADADA;border-radius:8px;background:#fff;margin-bottom:18px"></div>
 <div class="sec">Société</div><a class="nav ${S.screen==='vehs'||S.screen==='veh'?'on':''}" data-a="go:vehs">Véhicules</a><span class="nav">Ressources matérielles</span><span class="nav">Contrats</span><span class="nav">Contrôles réglementaires</span>
 <a class="nav ${S.screen==='planning'?'on':''}" data-a="go:planning">Planning</a>
 <a class="nav ${S.screen==='decl'?'on':''}" data-a="go:decl">Déclarations <span class="pill">${nb}</span></a>
 <div class="sec">Salariés <span class="chip" style="margin-left:6px">Nouveau</span></div><a class="nav" href="salaries.html" style="padding-left:24px">Salariés</a><a class="nav" href="salaries.html#demandes" style="padding-left:24px">Demandes</a><a class="nav" href="salaries.html#pointage" style="padding-left:24px">Pointage du jour</a><a class="nav" href="salaries.html#releve" style="padding-left:24px">Relevé du mois</a>
 <div class="sec">Général</div><span class="nav">Accueil</span><span class="nav" style="color:#9AA3A0">Paramètres</span>
 <label class="switch" style="margin-top:20px"><input type="checkbox" data-a="plain" ${document.body.classList.contains('plain')?'':'checked'}> Montrer les nouveautés</label>
 <span style="margin-top:auto;font-size:11px;text-align:center">Simulation — données fictives</span></div>
 <div class="main"><div class="top"><span style="font-size:20px">☰</span><div style="display:flex;align-items:center;gap:20px"><b>16 novembre 2026</b><span class="pill">${nb}</span><div class="user"><b>Gestionnaire de parc</b></div></div></div>`;
 if(S.screen==='vehs'){
  h += `<div class="band"><span class="title">Véhicules</span><span class="btn">+ Ajouter</span></div><div class="content"><div class="new"><span class="chip" style="margin:0 0 8px 0;display:inline-block">Nouveau · dans la liste, seulement l'information de terrain ; le détail est dans la fiche</span>
  <table><tr><th>Véhicule</th><th>Type</th><th>Pôle</th><th>Prochaine échéance</th><th>RDV</th><th>Prépa mines</th><th>Où il est</th></tr>`;
  Object.entries(VEH).forEach(([p,v])=>{ const dep = v.mines && /2026$/.test(v.mines) && +v.mines.slice(3,5)<11;
   h += `<tr><td>${lienPlaque(p)}</td><td>${v.type}</td><td>${v.pole}</td><td>Mines ${dep?badge(C.red,v.mines):v.mines}</td><td>${v.rdv||'<span class="note">pas de RDV</span>'}</td><td>${v.prepa==='À faire'?badge(C.org,'À faire'):(v.prepa==='En cours'?badge(C.blu,'En cours'):'—')}</td><td>${v.ou}</td></tr>`; });
  h += `</table></div><span class="note">Un clic sur la plaque ouvre la fiche du véhicule.</span></div>`;
 } else if(S.screen==='veh'){ const p=S.veh, v=VEH[p], tracteur=/Tracteur/.test(v.type);
  const decl = raw.filter(r=>r.plaque===p), inter = all.filter(i=>i.plaque===p);
  const onglet = (k,l)=>`<a class="${S.vtab===k?'on':''}" data-a="vtab:${k}">${l}</a>`;
  h += `<div class="band"><div><span class="title">${p}</span> <span style="font-size:14px;margin-left:8px">${v.type} · ${v.marque} · pôle ${v.pole}</span></div><div style="display:flex;gap:8px"><a class="btn2" data-a="go:vehs">‹ Véhicules</a><a class="btn" data-a="creerVeh">+ Créer une intervention</a></div></div><div class="content">
  <div class="new" style="display:flex;gap:10px"><div class="kpi"><span class="note">Prochaine échéance</span><b>Mines · ${v.mines}</b><span class="note">${v.rdv?'RDV '+v.rdv:'Pas de RDV posé'}</span></div><div class="kpi"><span class="note">Prépa mines</span><b>${v.prepa}</b></div><div class="kpi"><span class="note">Où il est</span><b>${v.ou}</b></div><div class="kpi"><span class="note">En cours</span><b>${decl.length} déclaration(s) · ${inter.length} intervention(s)</b></div></div>
  <div class="vtabs">${onglet('suivi','Suivi')}${onglet('ctrl','Contrôles réglementaires')}${onglet('docs','Documents')}${onglet('hist','Historique')}</div>`;
  if(S.vtab==='suivi'){
   h += `<div class="new" style="display:flex;flex-direction:column;gap:8px"><span class="chip" style="margin:0;align-self:flex-start">Nouveau · déclarations et interventions du véhicule au même endroit</span><b>Déclarations</b>`;
   if(!decl.length) h += `<span class="note">Aucune déclaration en cours.</span>`;
   decl.forEach(r=>{ const fait=S.created[r.id];
    h += `<div class="card" style="flex-direction:row;justify-content:space-between;align-items:center"><span><b>${r.type}</b> · ${r.desc} <span class="note">· ${r.date}</span></span>${fait?(S.clos[r.id]?badge(C.grn,'traitée'):badge(S.placed[r.id]?C.blu:C.org, S.placed[r.id]?'planifié '+S.placed[r.id]:'en attente de planning')):`<a class="btn" data-a="creer:${r.id}" style="padding:5px 12px">Créer l'intervention</a>`}</div>`; });
   h += `<b style="margin-top:6px">Interventions</b>`;
   if(!inter.length) h += `<span class="note">Aucune intervention.</span>`;
   inter.forEach(i=>{ const pla=S.placed[i.key];
    h += `<div class="card" style="flex-direction:row;justify-content:space-between;align-items:center"><span><b>${i.type}</b> · ${i.comm} <span class="note">· ${i.decl||'saisie sans déclaration'}</span></span>${S.fait[i.key]?badge(C.grn,'réalisée · '+S.fait[i.key].travaux):pla?badge(C.blu,'planifiée '+pla):`<a class="btn" data-a="placerVeh:${i.key}" style="padding:5px 12px">Placer sur le planning</a>`}</div>`; });

   else S.extra.push({key:'h'+n,kind:'hors',dur:d,type:'Hors mécanique',plaque:'—',cree:'16/11/2026',duree:du,comm:F.hors||'Administratif',rouler:'—',ou:'—',dispo:'Pas de véhicule',decl:''});
   set({modal:null,drawer:true,toast:'Ajouté aux interventions en attente'}); }
 else if(a==='drawer') set({drawer:!S.drawer});
 else if(a==='pick') set({picked:v,drawer:false,toast:''});
 else if(a==='unpick'){ if(S.depl){ S.slot[S.depl.id]=S.depl.slot; S.placed[S.depl.id]=S.depl.placed; } set({picked:null,depl:null,drawer:!S.depl}); }
 else if(a==='drop'){ const all=Object.fromEntries(intervList().map(i=>[i.key,i])), it=all[S.picked], id=S.picked, d=(it&&it.dur)||1;
   S.slot[id]={k:v,i:+w,d}; S.placed[id]=hh(+w)+' · '+cols[v].nom; const isDecl=!!byId[id];
   if(S.envoye[id]){ S.envoye[id]=false; S.renvoi[id]=true; } S.depl=null;
   set({picked:null,toast:'Placé · '+cols[v].nom+' à '+hh(+w)+(it.kind==='veh'?(S.renvoi[id]?' · modifié : à renvoyer avec « Envoyer »':' · à envoyer quand le planning est prêt (bouton « Envoyer »)'):'')+(isDecl?' · déclaration « En cours de traitement »':'')}); }
 else if(a==='bloc') set({modal:'bloc',blocId:v,toast:''});
 else if(a==='fin') set({modal:'fin',blocId:v,form:{travaux:''}});
 else if(a==='pasfini') set({modal:'pasfini',blocId:v,form:{}});
 else if(a==='validerFin'){ const id=S.blocId, decl=!!byId[id]; S.fait[id]={travaux:S.form.travaux.trim()}; if(decl && S.form.cloturer!=='non') S.clos[id]=true; delete S.replan[id];
   set({modal:null,toast:'Intervention réalisée'+(S.clos[id]?' · déclaration « Traitée » (elle sort de la liste à traiter)':'')}); }
 else if(a==='validerPasFini'){ const id=S.blocId; S.replan[id]=S.form.motif; delete S.slot[id]; delete S.placed[id]; delete S.envoye[id]; delete S.renvoi[id];
   set({modal:null,drawer:true,toast:'Pas terminé ('+S.form.motif+') · de retour dans les interventions en attente'}); }
 else if(a==='deplacer'){ S.depl={id:v,slot:S.slot[v],placed:S.placed[v]}; delete S.slot[v]; delete S.placed[v]; set({modal:null,picked:v,drawer:false,toast:''}); }
 else if(a==='retirer'){ delete S.slot[v]; delete S.placed[v]; delete S.envoye[v]; delete S.renvoi[v]; set({modal:null,drawer:true,toast:'Retiré du planning · de retour dans les interventions en attente'}); }
 else if(a==='envoyer') set({modal:'mail',mailIds:[v]});
 else if(a==='envoyerTout') set({modal:'mail',mailIds:aEnvoyer()});
 else if(a==='validerMail'){ const n=S.mailIds.length; S.mailIds.forEach(id=>{ S.envoye[id]=true; delete S.renvoi[id]; }); set({modal:null,mailIds:[],toast:(n>1?n+' mails prêts':'Mail prêt')+' dans Gmail · il reste à cliquer Envoyer'}); }
 else if(a==='plain'){ document.body.classList.toggle('plain', !el.checked); }
});
document.addEventListener('input', e=>{ const f=e.target.dataset && e.target.dataset.f; if(f){ S.form[f]=e.target.value; if(f==='plaque'||f==='comm'){ const ok=!(S.ajType==='veh' && (!(S.form.plaque||'').trim()||!(S.form.comm||'').trim())); const b=document.querySelector('[data-a=validerTache]'); if(b){ b.style.opacity=ok?'':'.45'; b.style.pointerEvents=ok?'':'none'; } } } });
document.addEventListener('change', e=>{ const f=e.target.dataset && e.target.dataset.f; if(!f) return; S.form[f] = e.target.type==='checkbox' ? (e.target.checked?'oui':'non') : e.target.value; });
document.addEventListener('input', e=>{ if(e.target.dataset && e.target.dataset.f==='travaux'){ const b=document.querySelector('[data-a=validerFin]'); if(b){ const ok=!!e.target.value.trim(); b.style.opacity=ok?'':'.45'; b.style.pointerEvents=ok?'':'none'; } } });
render();
</script>
</body>
